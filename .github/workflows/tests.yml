name: Python and Qt checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system interfaces on GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 tesseract-ocr tesseract-ocr-eng
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and verify open-licensed DotGothic16 on GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          source="https://raw.githubusercontent.com/google/fonts/main/ofl/dotgothic16"
          curl --fail --location --retry 3 "$source/DotGothic16-Regular.ttf" -o vendor/fonts/DotGothic16-Regular.ttf
          curl --fail --location --retry 3 "$source/OFL.txt" -o vendor/fonts/OFL.txt
          test "$(git hash-object vendor/fonts/DotGothic16-Regular.ttf)" = "844fc6373c3d5716eb9bde1d0663d8fffa4f8f06"
          test "$(git hash-object vendor/fonts/OFL.txt)" = "8a8f6546423f37d1306d76abedaa3c496b933c73"
      - name: Syntax checks
        run: python -m compileall -q clipmint tests
      - name: SQLite and offscreen Qt smoke tests
        run: python -m unittest discover -s tests -v
