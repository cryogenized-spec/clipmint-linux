name: Python and Qt checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system interfaces on GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1 tesseract-ocr tesseract-ocr-eng xvfb xclip xdotool
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and verify open-licensed DotGothic16 on GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          source="https://raw.githubusercontent.com/google/fonts/main/ofl/dotgothic16"
          curl --fail --location --retry 3 "$source/DotGothic16-Regular.ttf" -o vendor/fonts/DotGothic16-Regular.ttf
          curl --fail --location --retry 3 "$source/OFL.txt" -o vendor/fonts/OFL.txt
          test "$(git hash-object vendor/fonts/DotGothic16-Regular.ttf)" = "844fc6373c3d5716eb9bde1d0663d8fffa4f8f06"
          test "$(git hash-object vendor/fonts/OFL.txt)" = "8a8f6546423f37d1306d76abedaa3c496b933c73"
      - name: Fetch and verify OFL Cormorant Garamond for offline typography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          source="https://raw.githubusercontent.com/google/fonts/main/ofl/cormorantgaramond"
          curl --fail --location --retry 3 "$source/CormorantGaramond%5Bwght%5D.ttf" -o vendor/fonts/CormorantGaramond-Regular.ttf
          curl --fail --location --retry 3 "$source/CormorantGaramond-Italic%5Bwght%5D.ttf" -o vendor/fonts/CormorantGaramond-Italic.ttf
          curl --fail --location --retry 3 "$source/OFL.txt" -o vendor/fonts/OFL-CormorantGaramond.txt
          for font in vendor/fonts/CormorantGaramond-Regular.ttf vendor/fonts/CormorantGaramond-Italic.ttf vendor/fonts/OFL-CormorantGaramond.txt; do
            echo "downloaded $font: $(wc -c < "$font") bytes, Git blob $(git hash-object "$font")"
          done
          test "$(git hash-object vendor/fonts/CormorantGaramond-Regular.ttf)" = "d992a83ce525c330fad3a19087746bcb2dc038ee"
          test "$(git hash-object vendor/fonts/CormorantGaramond-Italic.ttf)" = "0d914e7663b7a1429d06ec60a5c5bb026031a2ef"
          test "$(git hash-object vendor/fonts/OFL-CormorantGaramond.txt)" = "507d70f4565352dbfcf2dfc9b42eb092b57c0be8"
      - name: Syntax checks
        run: python -m compileall -q clipmint tests
      - name: SQLite and offscreen Qt smoke tests
        run: python -m unittest discover -s tests -v
      - name: Cross-process clipboard round-trip on Xvfb
        env:
          QT_QPA_PLATFORM: xcb
          CLIPMINT_X11_TEST: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            python -m unittest discover -s tests -p test_x11_clipboard_roundtrip.py -v
