name: Python and Qt checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system interfaces on GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: python -m compileall -q clipmint tests
      - name: SQLite and offscreen Qt smoke tests
        run: python -m unittest discover -s tests -v
