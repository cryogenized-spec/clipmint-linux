name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: python -m compileall -q clipmint tests
      - name: SQLite unit tests
        run: python -m unittest discover -s tests -v
