name: Crimson Archive native visual review
on:
  push:
    branches: [feat/crimson-archive-native-ui, feat/v04-kohaku-gothic-archive]
    paths:
      - "clipmint/**"
      - "tools/render_crimson_review.py"
      - "tests/**"
      - ".github/workflows/crimson-native-review.yml"
  pull_request:
    paths:
      - "clipmint/**"
      - "tools/render_crimson_review.py"
      - "tests/**"
      - ".github/workflows/crimson-native-review.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner-only Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1
          python -m pip install -r requirements.txt
      - name: Fetch verified offline display font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          curl -fLsS --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/dotgothic16/DotGothic16-Regular.ttf -o vendor/fonts/DotGothic16-Regular.ttf
          test "$(git hash-object vendor/fonts/DotGothic16-Regular.ttf)" = "844fc6373c3d5716eb9bde1d0663d8fffa4f8f06"
      - name: Capture actual Qt UI at laptop and desktop sizes
        env:
          XDG_SESSION_TYPE: x11
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1680x1050x24" python -m tools.render_crimson_review docs/native-review
          file docs/native-review/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Kohaku-Gothic-native-Qt-screenshots
          path: docs/native-review/*.png
          retention-days: 14
