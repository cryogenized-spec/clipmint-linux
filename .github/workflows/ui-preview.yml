name: Capture actual ClipMint window preview
on:
  push:
    branches: [main]
    paths:
      - "tools/render_ui_preview.py"
      - "clipmint/app.py"
      - "clipmint/recording_ui.py"
      - ".github/workflows/ui-preview.yml"
  pull_request:
    paths:
      - "tools/render_ui_preview.py"
      - "clipmint/app.py"
      - "clipmint/recording_ui.py"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install renderer only on GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 xvfb
          python -m pip install -r requirements.txt
      - name: Render current Qt windows with synthetic snippets
        env:
          XDG_SESSION_TYPE: x11
          QT_QPA_PLATFORM: xcb
        run: |
          mkdir -p docs
          xvfb-run -a -s "-screen 0 1280x850x24" python -m tools.render_ui_preview docs/clipmint-ui-preview.png
          file docs/clipmint-*-preview.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipmint-ui-preview
          path: docs/clipmint-*-preview.png
