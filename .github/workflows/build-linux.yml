name: Build and publish verified ClipMint previews
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]
    paths:
      - "clipmint/**"
      - "tests/**"
      - "packaging/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    env:
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Kohaku full-body card
        run: |
          set -euo pipefail
          test -f clipmint/assets/kohaku_card.png
          echo "585800ce776353d84a9d60e798ff591d06b580f95be0943a46ae67c1c107817a  clipmint/assets/kohaku_card.png" | sha256sum --check
      - name: Install build tools on GitHub runner ONLY
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 xvfb desktop-file-utils tesseract-ocr tesseract-ocr-eng xdotool
          python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller==6.22.3"
      - name: Python syntax and clipboard database tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q clipmint tests launcher.py
          python -m unittest discover -s tests -v
      - name: Bundle checksum-verified static FFmpeg (GitHub runner only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p vendor /tmp/clipmint-ffmpeg
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-N-128227-g4811625b5f-linux64-gpl.tar.xz"
          expected="67929be39bbb696f41d3295686597a439aeac902f61d82be660ccc1453c1fdfb"
          if curl --fail --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 --output /tmp/clipmint-ffmpeg.tar.xz "$url"; then
            echo "$expected  /tmp/clipmint-ffmpeg.tar.xz" | sha256sum --check
            tar -xJf /tmp/clipmint-ffmpeg.tar.xz -C /tmp/clipmint-ffmpeg
            binary="$(find /tmp/clipmint-ffmpeg -path "*/bin/ffmpeg" -type f -print -quit)"
            test -n "$binary"
            install -m 755 "$binary" vendor/ffmpeg
          else
            # BtbN's old release intermittently returns HTTP 504.
            # Instead reuse the SAME already-vetted static FFmpeg executable
            # bundled in our immutable, checksum-verified Preview 240.1.
            # This downloads bytes only on the GitHub runner, not user devices.
            echo "Primary FFmpeg archive unavailable; use verified ClipMint preview fallback"
            mkdir -p /tmp/clipmint-ffmpeg/fallback
            fallback_tag="clipmint-preview-240-1"
            fallback_deb="clipmint_0.6.0.preview1.240.1_amd64.deb"
            gh release download "$fallback_tag" --repo "$GH_REPO" \
              --pattern "$fallback_deb" --pattern SHA256SUMS \
              --dir /tmp/clipmint-ffmpeg/fallback
            (cd /tmp/clipmint-ffmpeg/fallback && sha256sum --check SHA256SUMS)
            deb="/tmp/clipmint-ffmpeg/fallback/$fallback_deb"
            test "$(dpkg-deb -f "$deb" Package)" = "clipmint"
            test "$(dpkg-deb -f "$deb" Version)" = "0.6.0~preview1.240.1"
            test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
            dpkg-deb --fsys-tarfile "$deb" | \
              tar -xOf - ./opt/clipmint/_internal/tools/ffmpeg \
              > /tmp/clipmint-ffmpeg/reused-ffmpeg
            test -s /tmp/clipmint-ffmpeg/reused-ffmpeg
            install -m 755 /tmp/clipmint-ffmpeg/reused-ffmpeg vendor/ffmpeg
          fi
          vendor/ffmpeg -hide_banner -devices 2>&1 | grep -q x11grab
          vendor/ffmpeg -hide_banner -encoders 2>&1 | grep -q libx264
          echo "Bundled video encoder supports X11 area input and H264"
      - name: Fetch OFL DotGothic16 for offline installer (runner only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          source="https://raw.githubusercontent.com/google/fonts/main/ofl/dotgothic16"
          curl --fail --location --retry 3 "$source/DotGothic16-Regular.ttf" -o vendor/fonts/DotGothic16-Regular.ttf
          curl --fail --location --retry 3 "$source/OFL.txt" -o vendor/fonts/OFL.txt
          test "$(git hash-object vendor/fonts/DotGothic16-Regular.ttf)" = "844fc6373c3d5716eb9bde1d0663d8fffa4f8f06"
          test "$(git hash-object vendor/fonts/OFL.txt)" = "8a8f6546423f37d1306d76abedaa3c496b933c73"
      - name: Fetch and verify OFL Cormorant Garamond for offline typography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fonts
          source="https://raw.githubusercontent.com/google/fonts/main/ofl/cormorantgaramond"
          curl --fail --location --retry 3 "$source/CormorantGaramond%5Bwght%5D.ttf" -o vendor/fonts/CormorantGaramond-Regular.ttf
          curl --fail --location --retry 3 "$source/CormorantGaramond-Italic%5Bwght%5D.ttf" -o vendor/fonts/CormorantGaramond-Italic.ttf
          curl --fail --location --retry 3 "$source/OFL.txt" -o vendor/fonts/OFL-CormorantGaramond.txt
          test "$(git hash-object vendor/fonts/CormorantGaramond-Regular.ttf)" = "d992a83ce525c330fad3a19087746bcb2dc038ee"
          test "$(git hash-object vendor/fonts/CormorantGaramond-Italic.ttf)" = "0d914e7663b7a1429d06ec60a5c5bb026031a2ef"
          test "$(git hash-object vendor/fonts/OFL-CormorantGaramond.txt)" = "507d70f4565352dbfcf2dfc9b42eb092b57c0be8"
      - name: Freeze Python Qt application
        run: |
          test -f /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0
          pyinstaller --noconfirm --clean --windowed --onedir --name ClipMint \
            --hidden-import "_cffi_backend" \
            --hidden-import "bsdiff4" \
            --hidden-import "keyring.backends.SecretService" \
            --collect-submodules "secretstorage" \
            --collect-binaries "nacl" \
            --add-binary "vendor/ffmpeg:tools" \
            --add-data "vendor/fonts/DotGothic16-Regular.ttf:assets/fonts" \
            --add-data "vendor/fonts/CormorantGaramond-Regular.ttf:assets/fonts" \
            --add-data "vendor/fonts/CormorantGaramond-Italic.ttf:assets/fonts" \
            --add-data "clipmint/assets/crimson_maid.png:assets/manga" \
            --add-data "clipmint/assets/kohaku_card.png:assets/manga" \
            --add-binary "/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0:." \
            launcher.py
          ldd dist/ClipMint/_internal/PySide6/Qt/plugins/platforms/libqxcb.so || true
          test -x dist/ClipMint/ClipMint
          test -x dist/ClipMint/_internal/tools/ffmpeg
          test -f dist/ClipMint/_internal/assets/fonts/DotGothic16-Regular.ttf
          test -f dist/ClipMint/_internal/assets/fonts/CormorantGaramond-Regular.ttf
          test -f dist/ClipMint/_internal/assets/fonts/CormorantGaramond-Italic.ttf
          test -f dist/ClipMint/_internal/assets/manga/crimson_maid.png
          test -f dist/ClipMint/_internal/assets/manga/kohaku_card.png
      - name: Test executable starts with virtual X11 display
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set +e
          xvfb-run -a timeout 12s dist/ClipMint/ClipMint
          code=$?
          set -e
          if [[ "$code" -ne 124 ]]; then echo "Unexpected app exit status: $code"; exit 1; fi
      - name: Select preview or tagged Debian version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Refusing invalid release version: $GITHUB_REF_NAME" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            # A fresh preview must be a REAL upgrade, not another file with
            # the same Debian version. Otherwise apt can skip installation,
            # leaving users on the old screenshot code.
            # RUN_NUMBER increases per workflow; ATTEMPT increases on reruns.
            : "${GITHUB_RUN_NUMBER:?Missing GitHub Actions run number}"
            : "${GITHUB_RUN_ATTEMPT:?Missing GitHub Actions run attempt}"
            version="0.6.0~preview1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
      - name: Create Debian package (preview or verified tag)
        env:
          CLIPMINT_VERSION: ${{ steps.version.outputs.package_version }}
        run: bash packaging/build-deb.sh
      - name: Verify and smoke-test installer (CI runner only)
        env:
          CLIPMINT_VERSION: ${{ steps.version.outputs.package_version }}
        run: bash packaging/verify-field-package.sh "dist-packages/clipmint_${CLIPMINT_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMint-v0.6-main-integration-preview
          path: dist-packages/
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    # Only successful builds from the upstream main branch are public update
    # candidates. PRs and forked workflows NEVER gain write permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cryogenized-spec/clipmint-linux'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CLIPMINT_VERSION: ${{ needs.build.outputs.package_version }}
    concurrency:
      group: clipmint-publish-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClipMint-v0.6-main-integration-preview
          path: dist-packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable preview package before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd dist-packages
          sha256sum --check SHA256SUMS
          version="${CLIPMINT_VERSION:?Missing built package version}"
          [[ "$version" =~ ^0\.6\.0~preview1\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -s "clipmint_${version}_amd64.deb"
          test "$(dpkg-deb -f "clipmint_${version}_amd64.deb" Package)" = clipmint
          test "$(dpkg-deb -f "clipmint_${version}_amd64.deb" Version)" = "$version"
          test "$(dpkg-deb -f "clipmint_${version}_amd64.deb" Architecture)" = amd64
          # GitHub release assets normalize '~' to '.'; publish an explicitly
          # normalized basename and checksum instead of breaking updater links.
          published="clipmint_${version/\~/.}_amd64.deb"
          mv "clipmint_${version}_amd64.deb" "$published"
          sha256sum "$published" > SHA256SUMS
      - name: Prepare optional verified delta from previous published preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only verified main-branch prereleases are usable as delta bases.
          # If no previous package can be verified, keep the full installer.
          previous_tag="$(gh api "repos/$GH_REPO/releases?per_page=50" --jq '[.[] | select(.prerelease == true and .draft == false) | select(.tag_name | test("^clipmint-preview-[0-9]+-[0-9]+$"))][0].tag_name // empty' || true)"
          if [[ -z "$previous_tag" ]]; then
            echo "No previous published preview; full installer only"
            exit 0
          fi
          mkdir -p previous
          if ! gh release download "$previous_tag" --pattern 'clipmint_*_amd64.deb' --pattern 'SHA256SUMS' --dir previous; then
            echo "Unable to fetch previous preview; full installer only"
            exit 0
          fi
          # Older GitHub preview assets replaced '~' with '.' while leaving
          # their checksum manifest's filename unchanged. Verify the same
          # digest against the actual downloaded file, without trusting a
          # different filename embedded in an old manifest.
          expected_previous="$(awk 'NR == 1 {print $1}' previous/SHA256SUMS)"
          old=(previous/clipmint_*_amd64.deb)
          if [[ "${#old[@]}" -ne 1 || ! -f "${old[0]}" || ! "$expected_previous" =~ ^[a-fA-F0-9]{64}$ || "$(sha256sum "${old[0]}" | awk '{print $1}')" != "$expected_previous" ]]; then
            echo "Unverified previous package; full installer only"
            exit 0
          fi
          if [[ "${#old[@]}" -ne 1 || ! -f "${old[0]}" ]]; then
            echo "Previous release package not unique; full installer only"
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check "bsdiff4>=1.4.0,<2"; then
            echo "Delta build dependency unavailable; full installer only"
            exit 0
          fi
          if ! python packaging/build-delta.py "${old[0]}" "dist-packages/clipmint_${CLIPMINT_VERSION/\~/.}_amd64.deb" dist-packages; then
            echo "Delta verification failed; full installer remains available"
            rm -f dist-packages/DELTA.json dist-packages/clipmint_delta_from_*_amd64.*
          fi
      - name: Prepare optional verified delta from updater bootstrap Preview 227.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Users who started with the 227.1 updater can upgrade without a
          # second 120 MB bootstrap download if they retained its installer.
          mkdir -p base-227 patch-227
          base_tag="clipmint-preview-227-1"
          base_deb="clipmint_0.6.0.preview1.227.1_amd64.deb"
          if ! gh release download "$base_tag" --pattern "$base_deb" \
              --pattern SHA256SUMS --dir base-227; then
            echo "Bootstrap preview unavailable; omit legacy delta"
            exit 0
          fi
          (cd base-227 && sha256sum --check SHA256SUMS)
          test "$(dpkg-deb -f "base-227/$base_deb" Version)" = "0.6.0~preview1.227.1"
          if ! python -m pip install --disable-pip-version-check "bsdiff4>=1.4.0,<2"; then
            echo "Legacy delta tool unavailable; skip bootstrap patch"
            exit 0
          fi
          if ! python packaging/build-delta.py \
              "base-227/$base_deb" \
              "dist-packages/clipmint_${CLIPMINT_VERSION/\~/.}_amd64.deb" \
              patch-227; then
            echo "Legacy delta cannot be rebuilt byte-for-byte"
            exit 0
          fi
          if [[ -f patch-227/DELTA.json ]]; then
            patches=(patch-227/clipmint_delta_from_*_amd64.*)
            if [[ "${#patches[@]}" -ne 1 || ! -f "${patches[0]}" ]]; then
              echo "Legacy delta artifact incomplete" >&2
              exit 1
            fi
            mv patch-227/DELTA.json dist-packages/DELTA-227.json
            mv "${patches[0]}" dist-packages/
            echo "Verified bootstrap 227.1 patch added to preview"
          else
            echo "No affordable legacy bootstrap delta; no large patch published"
          fi
      - name: Prepare standalone small-data bootstrap for Preview 227.1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dist-packages/DELTA-227.json ]]; then
            version="${CLIPMINT_VERSION:?Missing built preview version}"
            tag="clipmint-preview-${GITHUB_RUN_NUMBER}-${version##*.}"
            python packaging/generate-preview-bootstrap.py \
              "$tag" "$version" dist-packages/clipmint-bootstrap-from-227.py
            python -m py_compile dist-packages/clipmint-bootstrap-from-227.py
            (cd dist-packages && sha256sum clipmint-bootstrap-from-227.py > BOOTSTRAP-SHA256SUMS)
          fi
      - name: Publish immutable GitHub prerelease (automatic update channel)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Skip an outdated build if a newer main commit already exists.
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Main advanced: skip publishing stale preview $GITHUB_SHA"
            exit 0
          fi
          version="${CLIPMINT_VERSION:?Missing built package version}"
          # Rerun-failed-jobs reuses the already built artifact, but the new
          # GITHUB_RUN_ATTEMPT would be different. Derive tag from the actual
          # version, never from the publisher's retry attempt.
          tag="clipmint-preview-${GITHUB_RUN_NUMBER}-${version##*.}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              # gh release create publishes via draft -> upload -> publish.
              # Cancellation can strand an invisible draft. Retry safely by
              # deleting only this unpublicized run-specific draft and tag.
              gh release delete "$tag" --yes --cleanup-tag
            elif [[ "$is_draft" == "false" ]]; then
              # Never claim success for an incomplete public release.
              assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
              assets_to_publish=("dist-packages/clipmint_${version/\~/.}_amd64.deb" dist-packages/SHA256SUMS)
              manifests=(dist-packages/DELTA*.json)
              patches=(dist-packages/clipmint_delta_from_*_amd64.*)
              if [[ -f "${manifests[0]}" ]]; then
                if [[ ! -f "${patches[0]}" || "${#manifests[@]}" -ne "${#patches[@]}" ]]; then
                  echo "Incomplete delta set" >&2
                  exit 1
                fi
                assets_to_publish+=("${manifests[@]}" "${patches[@]}")
              fi
              if [[ -f dist-packages/clipmint-bootstrap-from-227.py ]]; then
                (cd dist-packages && sha256sum --check BOOTSTRAP-SHA256SUMS)
                assets_to_publish+=(dist-packages/clipmint-bootstrap-from-227.py dist-packages/BOOTSTRAP-SHA256SUMS)
              fi
              expected="$(printf '%s\n' "${assets_to_publish[@]##*/}" | sort)"
              if [[ "$assets" != "$expected" ]]; then
                echo "Published preview exists with incomplete or unexpected assets" >&2
                exit 1
              fi
              echo "Verified preview $tag already published; nothing to do"
              exit 0
            else
              echo "Unable to determine preview release draft state" >&2
              exit 1
            fi
          fi
          assets_to_publish=("dist-packages/clipmint_${version/\~/.}_amd64.deb" dist-packages/SHA256SUMS)
          manifests=(dist-packages/DELTA*.json)
          patches=(dist-packages/clipmint_delta_from_*_amd64.*)
          if [[ -f "${manifests[0]}" ]]; then
            if [[ ! -f "${patches[0]}" || "${#manifests[@]}" -ne "${#patches[@]}" ]]; then
              echo "Incomplete delta set" >&2
              exit 1
            fi
            # Every manifest MUST point to a present, SHA256-matching patch.
            for manifest in "${manifests[@]}"; do
              python - "$manifest" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          manifest = Path(sys.argv[1])
          data = json.loads(manifest.read_text())
          patch = manifest.parent / data["patch_name"]
          if (not patch.is_file() or patch.is_symlink()
                  or patch.stat().st_size != data["patch_size"]
                  or hashlib.sha256(patch.read_bytes()).hexdigest() != data["patch_sha256"]):
              raise SystemExit(f"Unverified delta asset in {manifest.name}")
          PY
            done
            assets_to_publish+=("${manifests[@]}" "${patches[@]}")
          fi
          if [[ -f dist-packages/clipmint-bootstrap-from-227.py ]]; then
            (cd dist-packages && sha256sum --check BOOTSTRAP-SHA256SUMS)
            assets_to_publish+=(dist-packages/clipmint-bootstrap-from-227.py dist-packages/BOOTSTRAP-SHA256SUMS)
          fi
          gh release create "$tag" "${assets_to_publish[@]}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "ClipMint Preview $version" \
            --notes "Verified Linux Mint preview from main commit $GITHUB_SHA. Installs require native package-manager approval. See SHA256SUMS."
  publish-release:
    # Only an explicit version-tag push can publish. PRs and manual preview
    # builds never publish a release or gain contents:write permission.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipMint-v0.6-main-integration-preview
          path: dist-packages
      - name: Check artifact checksum and expected version
        shell: bash
        run: |
          set -euo pipefail
          cd dist-packages
          sha256sum --check SHA256SUMS
          test -f "clipmint_${GITHUB_REF_NAME#v}_amd64.deb"
      - name: Publish GitHub Release with installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist-packages/clipmint_${GITHUB_REF_NAME#v}_amd64.deb" \
            dist-packages/SHA256SUMS \
            --title "ClipMint ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
